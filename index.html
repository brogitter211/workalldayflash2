<!DOCTYPE html>
<html>
<head>
    <title>Web Player</title>
    <style>
        /* Force everything to take up 100% of the screen */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
        }
        #player { 
            width: 100%; 
            height: 100%; 
        }
        /* Target Ruffle specifically to stretch it */
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="player"></div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);
            // Replace with your exact SWF file name
            player.load("547504_hw_demo.swf"); 
        });
    </script>
</body>
</html>
