<!DOCTYPE html>
<html>
<head>
    <title>Web Player</title>
    <style>
        /* Reset and force 100% viewport space */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background: #000; 
        }
        
        /* Force the div, ruffle-player, and inner canvas to fill the screen */
        #player, ruffle-player, ruffle-player canvas { 
            width: 100% !important; 
            height: 100% !important;
            display: block !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="player"></div>
    <script>
        // Tell Ruffle how to behave globally before loading
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "letterbox": "off",
            "scale": "showAll",
            "forceScale": true,
            "autoplay": "off",
            "unmuteOverlay": "hidden"
        };

        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);
            // Replace with your exact SWF file name
            player.load("547504_hw_demo.swf"); 
        });
    </script>
</body>
</html>
